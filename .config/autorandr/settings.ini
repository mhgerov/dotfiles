[config]
# Match monitors by EDID rather than connector name. This SSD boots two
# machines whose connector names differ (laptop: eDP-1/HDMI-1/DP-1/DP-2;
# desktop: HDMI-1/DP-1/DP-2/DP-3), and it also means moving a cable to a
# different port still matches the saved profile.
match-edid=1

# If no saved profile matches, stack whatever is connected horizontally at its
# best resolution rather than leaving the screen dark. Without this, autorandr
# keeps the current (possibly zero-CRTC) configuration.
default=horizontal
